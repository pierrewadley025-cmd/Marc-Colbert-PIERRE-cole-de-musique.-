<style>

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:Georgia,'Times New Roman',serif;line-height:1.55}
.banner{position:relative;overflow:hidden;background:linear-gradient(120deg,#0d0d10,#2b2b31);border-bottom:4px solid var(--gold2);padding:22px 20px;display:flex;align-items:center;gap:16px;color:#fff}
.banner:before,.banner:after{content:"";position:absolute;right:-40px;top:-60px;width:220px;height:220px;border:14px solid transparent;border-image:linear-gradient(135deg,#b8892b,#f4d35e,#b8892b) 1;transform:rotate(45deg);opacity:.75}
.banner:after{right:40px;top:-110px;width:160px;height:160px;border-width:5px}

main{max-width:780px;margin:0 auto;padding:16px}

.hero p{max-width:560px;margin:0 auto 14px;opacity:.85}
.feat{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.feat span{background:var(--card);border:1px solid var(--gold);border-radius:99px;padding:6px 14px;font:600 .85rem Arial,sans-serif}
.card{background:var(--card);border:1px solid var(--line);border-top:3px solid var(--gold);border-radius:12px;padding:18px;margin:14px 0;box-shadow:0 4px 14px #0001}
h2,h3{color:var(--gold)}
button{background:linear-gradient(135deg,#c99a35,#f0cf70);color:#151515;border:0;border-radius:8px;padding:10px 18px;font:700 .95rem Arial,sans-serif;cursor:pointer;margin:4px 4px 4px 0;transition:transform .15s}
button:hover{transform:translateY(-2px)}
button.alt{background:transparent;color:var(--fg);border:1px solid var(--line)}
input{padding:11px;border:1px solid var(--line);border-radius:8px;width:100%;background:var(--bg);color:var(--fg);font-size:1rem}
.langs{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.lc{display:flex;flex-direction:column;align-items:center;gap:6px;padding:18px 8px;margin:0;background:var(--bg);color:var(--fg);border:1px solid var(--line);font-size:1rem}
.lc:hover{border-color:var(--gold);box-shadow:0 6px 16px #0002}.fl{font-size:2.2rem}
.bar{height:10px;border-radius:9px;background:var(--line);overflow:hidden;margin:8px 0}.bar i{display:block;height:100%;background:linear-gradient(90deg,#b8892b,#f4d35e)}
.lv{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--line);font-family:Arial,sans-serif}
.num{width:38px;height:38px;border-radius:50%;background:#111;color:var(--gold2);border:2px solid var(--gold2);display:inline-flex;align-items:center;justify-content:center;font-weight:700;font-size:.8rem;margin-right:10px}
.ok{color:var(--ok)}.ko{color:var(--ko)}.big{font-size:1.4rem}
footer{text-align:center;padding:20px;font:.8rem Arial,sans-serif;opacity:.7;border-top:1px solid var(--line);margin-top:20px}
.cert{border:6px double var(--gold);background:#fff;color:#222;padding:24px 16px;text-align:center;margin:12px 0}
.cert h1{margin:8px 0;font-size:1.7rem;letter-spacing:1px;color:#222}.cert .name{font-size:2rem;color:#b8892b;font-style:italic;border-bottom:2px solid #555;display:inline-block;padding:0 24px;margin:8px 0}
.row{display:flex;justify-content:space-around;align-items:flex-end;flex-wrap:wrap;gap:8px}
@media(max-width:520px){.hero h1{font-size:1.6rem}.banner h2{font-size:1.1rem}}
@media print{.banner,.noprint,footer{display:none}body{background:#fff}}

function RS(){const r=(RICH[S.lang]||{})[cur];return r?r[sn]:null}
function N(i){const r=(RICH[S.lang]||{})[i];return r?r.length:3}
function T(k){const r=RS();return r?(k==='w'?r.d:r.s):PH()}
function chkQ(){const r=RS();let ok=0,out=[];r.q.forEach((q,i)=>{const c=document.querySelector('input[name=q'+i+']:checked');if(c&&+c.value===q.a)ok++;else out.push(q.q+' → <b>'+q.o[q.a]+'</b>')});const s=Math.round(100*ok/r.q.length);sc.q=s;$('#fq').innerHTML=s>=70?`<span class="ok">Bravo ! ${ok}/${r.q.length} bonnes réponses.</span>`+(out.length?'<br>À revoir : '+out.join('<br>'):''):`<span class="ko">${ok}/${r.q.length}. Relisez le texte et réessayez.</span><br>Corrections : ${out.join('<br>')}`;fin()}
const VIDEOS={};/* ex: VIDEOS.en=['ID_YOUTUBE_A1',...] */
let S,U,cur=null,t0=0;
try{S=JSON.parse(localStorage.getItem('jsv')||'null')}catch(e){}
S=S||{email:null,lang:null,done:[],sec:0,ses:0,id:null,prog:{}};S.prog=S.prog||{};
function save(){try{localStorage.setItem('jsv',JSON.stringify(S))}catch(e){}}
const $=s=>document.querySelector(s),app=$('#app');
function norm(s,z){s=s.toLowerCase().replace(/[.,!?;:'"¿¡，。！？]/g,'').trim();return z?s.replace(/\s/g,'').split(''):s.split(/\s+/)}
function score(a,b,z){const A=norm(a,z),B=norm(b,z);if(!B.length)return 0;const pool=[...A];let m=0;B.forEach(w=>{const i=pool.indexOf(w);if(i>-1){m++;pool.splice(i,1)}});return Math.round(100*m/B.length)}
function say(txt,c){try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(txt);u.lang=c;speechSynthesis.speak(u)}catch(e){}}
function render(){
 if(!S.email)return login();
 if(!S.lang)return pick();
 if(cur!==null)return lesson();
 dash();}
function login(){app.innerHTML=`<section class="hero"><p class="kick">Langues vivantes</p><h1>Parlez le monde,<br>une langue à la fois</h1><p>Anglais, espagnol, français, allemand et mandarin : des cours méthodiques, des exercices vocaux corrigés en direct et un certificat d'achèvement officiel.</p><div class="feat"><span>🎧 Audio et vidéos</span><span>🎤 Correction vocale</span><span>🎓 Certificat</span></div></section><div class="card"><h2>Commencer</h2><p>Entrez votre nom complet pour suivre votre progression et recevoir votre certificat.</p><input id="fn" placeholder="Votre nom complet"><button onclick="doLogin()">Continuer</button><p id="msg" class="ko"></p></div>`}
function doLogin(){const n=$('#fn').value.trim();if(!n){$('#msg').textContent='Veuillez entrer votre nom complet.';return}S.name=n;S.email=n;save();render()}
const FL={en:'🇬🇧',fr:'🇫🇷',es:'🇪🇸',de:'🇩🇪',zh:'🇨🇳'};
function pick(){app.innerHTML=`<div class="card"><h2>Choisissez votre langue</h2><p><b>Attention :</b> un seul cours par élève. Ce choix est définitif.</p><div class="langs">${Object.keys(L).map(k=>`<button class="lc" onclick="choose('${k}')"><span class="fl">${FL[k]}</span>${L[k].n}</button>`).join('')}</div></div>`}
function choose(k){app.innerHTML=`<div class="card"><h2>${FL[k]} ${L[k].n}</h2><p>Confirmer ce choix ? Il ne pourra plus être modifié.</p><button onclick="setLang('${k}')">Oui, confirmer</button><button class="alt" onclick="render()">Annuler</button></div>`}
function setLang(k){S.lang=k;S.id='JSV-'+Math.random().toString(36).slice(2,8).toUpperCase();save();render()}
function fmt(){const m=Math.round(S.sec/60);return Math.floor(m/60)+' h '+String(m%60).padStart(2,'0')+' min'}
function dash(){const l=L[S.lang],all=S.done.length===4;
 app.innerHTML=`<div class="card"><h2>${FL[S.lang]} ${l.n}</h2><small>${S.name||S.email}</small><div class="bar"><i style="width:${S.done.length*25}%"></i></div><p>Progression : <b>${S.done.length}/4</b> niveaux · Séances : <b>${S.ses}</b> · Temps d'étude : <b>${fmt()}</b></p>
 ${l.lv.map((v,i)=>{const d=S.done.includes(i),open=i===0||S.done.includes(i-1);return `<div class="lv"><span><span class="num">${i+1}</span>Niveau ${v} <small>(${d?N(i):(S.prog[i]||0)}/${N(i)})</small> ${d?'<span class="ok">✔ réussi</span>':open?'':'🔒'}</span><button ${open?'':'disabled style="opacity:.4"'} onclick="openLesson(${i})">${d?'Revoir':'Commencer'}</button></div>`}).join('')}</div>
 ${all?`<button onclick="cert()">🎓 Obtenir mon certificat</button>`:`<p><small>Le certificat est délivré après la réussite des 4 niveaux.</small></p>`}
 `}
function toast(t){const d=document.createElement('div');d.textContent=t;d.style.cssText='position:fixed;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top,0px) + 12px);background:#111;color:#f4d35e;padding:12px 18px;border-radius:10px;z-index:9;font:700 .95rem Arial,sans-serif;box-shadow:0 4px 14px #0006';document.body.appendChild(d);setTimeout(()=>d.remove(),3500)}
function openLesson(i){cur=i;sn=S.done.includes(i)?0:Math.min(S.prog[i]||0,N(i)-1);t0=Date.now();S.ses++;save();render()}
function endSession(){if(cur!==null){S.sec+=Math.round((Date.now()-t0)/1000);save()}}
let sc={w:null,s:null};
function lesson(){const l=L[S.lang],r=RS(),v=(VIDEOS[S.lang]||[])[cur];sc={w:null,s:null,q:r?null:100};
 const top=r?`<p><b>${r.n}</b></p><h3>Objectifs</h3><ul>${r.o.map(x=>`<li>${x}</li>`).join('')}</ul><h3>Vocabulaire (cliquez pour écouter)</h3><div>${r.v.map(x=>`<button class="alt" onclick="say('${x[0].replace(/'/g,"\\'")}','${l.c}')">🔊 ${x[0]} — ${x[1]}</button>`).join('')}</div><h3>Texte à lire et à écouter</h3><p class="big" lang="${l.c}">${r.t.replace(/\n/g,'<br>')}</p><button onclick="say(RS().t,'${l.c}')">🔊 Écouter le texte</button><p><small>Grammaire : ${r.g}</small></p>`:`<h3>Texte à lire et à écouter</h3><p class="big" lang="${l.c}">${PH()}</p><button onclick="say(PH(),'${l.c}')">🔊 Écouter</button>`;
 const qz=r?`<h3>Questions</h3>${r.q.map((q,i)=>`<p><b>${q.q}</b><br>${q.o.map((o,j)=>`<label style="display:block"><input type="radio" name="q${i}" value="${j}" style="width:auto"> ${o}</label>`).join('')}</p>`).join('')}<button onclick="chkQ()">Vérifier mes réponses</button><p id="fq"></p>`:'';
 const cv=r?`<p>${r.c}<br>La plateforme demande : <b>${r.pq}</b> <button class="alt" onclick="say(RS().pq,'${l.c}')">🔊</button><br>Phrase à dire : <b>${r.s}</b></p>`:'<p>Répétez la phrase du texte.</p>';
 app.innerHTML=`<button class="alt" onclick="back()">← Retour</button><div class="card"><h2>Niveau ${l.lv[cur]} · Séance ${sn+1}/${N(cur)}</h2>${top}
 <h3>Vidéo</h3>${v?`<iframe width="100%" height="315" src="https://www.youtube-nocookie.com/embed/${v}" allowfullscreen></iframe>`:'<p><small>Aucune vidéo ajoutée pour ce niveau (voir VIDEOS dans le code).</small></p>'}${qz}
 <h3>Dictée : écoutez puis écrivez</h3><button onclick="say(T('w'),'${l.c}')">🔊 Écouter</button><input id="dic" placeholder="Écrivez ce que vous entendez"><button onclick="chkW()">Vérifier</button><p id="fw"></p>
 <h3>Conversation : parlez à voix haute</h3>${cv}<button onclick="listen()">🎤 Parler</button><small> (Chrome, micro autorisé)</small><input id="sp" placeholder="Tapez ici la phrase à dire, puis cliquez sur Vérifier"><button class="alt" onclick="chkS($('#sp').value)">Vérifier</button><p id="fs"></p></div>`}
function fb(el,a,k){const z=S.lang==='zh',s=score(a,T(k),z);el.innerHTML=s>=70?`<span class="ok">Bravo ! Excellent travail (${s} %).</span>`+(s<100?`<br>Modèle : ${T(k)}`:''):`<span class="ko">Pas tout à fait (${s} %). Réessayez.</span><br>Phrase correcte : <b>${T(k)}</b>`;return s}
function chkW(){sc.w=fb($('#fw'),$('#dic').value,'w');fin()}
function chkS(a){sc.s=fb($('#fs'),a,'s');fin()}
function listen(){const R=window.SpeechRecognition||window.webkitSpeechRecognition;if(!R){$('#fs').textContent='Reconnaissance vocale non disponible : utilisez Chrome ou saisissez votre réponse.';return}
 const r=new R();r.lang=L[S.lang].c;r.onresult=e=>{const t=e.results[0][0].transcript;$('#sp').value=t;chkS(t)};r.onerror=e=>{const blk="Le micro est bloqué dans cet aperçu. Pas de souci : tapez la phrase dans la case ci-dessous, puis cliquez sur Vérifier pour continuer. (Pour parler, ouvrez le fichier téléchargé dans Chrome.)";const m={'not-allowed':blk,'service-not-allowed':blk,'no-speech':"Je n'ai rien entendu. Parlez plus près du micro et réessayez.",'audio-capture':"Aucun micro détecté sur cet appareil.",'network':"Une connexion Internet est nécessaire pour la reconnaissance vocale."};$('#fs').textContent=m[e.error]||"Micro inaccessible : tapez votre réponse.";const i=$('#sp');i.style.borderColor='var(--gold)';i.style.boxShadow='0 0 0 3px #d9a93f66';i.focus()};try{r.start()}catch(x){$('#fs').textContent="Micro inaccessible : tapez votre réponse."};$('#fs').textContent='Je vous écoute…'}
function fin(){if(sc.w>=70&&sc.s>=70&&sc.q>=70){endSession();if(sn<N(cur)-1){sn++;if(!S.done.includes(cur))S.prog[cur]=sn;S.ses++;t0=Date.now();save();toast('Séance réussie ! Passons à la suivante.');lesson()}else{if(!S.done.includes(cur))S.done.push(cur);S.prog[cur]=N(cur);save();cur=null;toast('Niveau réussi ! Félicitations.');render()}}}
function back(){endSession();cur=null;render()}
function cert(){const l=L[S.lang],t=l.t,d=new Date().toLocaleDateString(l.c);
 const nm=S.name||S.email.split('@')[0].replace(/[._]/g,' ');
 app.innerHTML=`<div class="noprint"><label>Nom à imprimer sur le certificat</label><input id="nm" value="${nm}" oninput="$('#cn').textContent=this.value"></div>
 <div class="cert" lang="${l.c}"><div class="row"><svg width="80" height="80" viewBox="0 0 100 100"><circle cx="50" cy="50" r="46" fill="#111" stroke="#d9a93f" stroke-width="4"/><path d="M28 66V36l22 8 22-8v30l-22-8z" fill="none" stroke="#d9a93f" stroke-width="4" stroke-linejoin="round"/><path d="M50 44v22" stroke="#d9a93f" stroke-width="4"/></svg><b>École Jeanne Siloge VILCERON</b></div>
 <h1>${t[0]}</h1><p>${t[1]}</p><div class="name" id="cn">${nm}</div>
 <p>${t[2]} <b style="color:#b8892b">${l.n}</b><br>${t[3]} : <b>${l.lv[3]}</b></p>
 <p>${t[4]} : <b>${fmt()}</b> · ${t[5]} : <b>${S.ses}</b> · ${t[6]} : ${d}</p>
 <div class="row"><svg width="110" height="110" viewBox="0 0 120 120"><defs><path id="ar" d="M60 60m-42 0a42 42 0 1 1 84 0a42 42 0 1 1-84 0"/></defs><circle cx="60" cy="60" r="56" fill="#111" stroke="#d9a93f" stroke-width="4"/><circle cx="60" cy="60" r="30" fill="none" stroke="#d9a93f"/><text fill="#d9a93f" font-size="10" font-family="Arial"><textPath href="#ar">JEANNE SILOGE VILCERON · SCEAU OFFICIEL ·</textPath></text><path d="M45 62V48l15 5 15-5v14l-15-5z" fill="none" stroke="#d9a93f" stroke-width="3"/></svg>
 <div><svg width="170" height="60" viewBox="0 0 170 60"><path d="M8 48C20 10 34 8 30 30S24 52 44 30s10 22 30 0 20 10 40-8 30 6 48-4" fill="none" stroke="#1d3fbf" stroke-width="2.5" stroke-linecap="round"/></svg><div style="border-top:2px solid #555;padding-top:4px"><b>Wadley PIERRE</b><br>${t[7]}</div></div></div>
 <small>${t[8]} ${S.id}</small></div>
 <button class="noprint" onclick="window.print()">🖨️ Imprimer / PDF</button><button class="alt noprint" onclick="render()">Retour</button>`}
render();
</script></body></html>
